<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>maekara</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=M+PLUS+2:wght@400;500;700&display=swap');

  :root{
    --bg: #eef1ec;
    --card: #ffffff;
    --ink: #22301f;
    --ink-soft: #6b7566;
    --line: #e2e6dd;
    --moss: #4a5d3f;
    --moss-deep: #33422b;
    --clay: #c15c3e;
    --clay-soft: #f3ddd3;
    --sand: #f6f2e9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    font-family:'M PLUS 2', sans-serif;
    color: var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .phone{
    width:100%;
    max-width:460px;
    min-height:100vh;
    background: var(--bg);
    padding: 22px 18px 40px;
    position:relative;
  }
  header{
    padding: 6px 4px 20px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .eyebrow{
    font-size:13px;
    color:var(--ink-soft);
    letter-spacing:.02em;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:#b7bfae;
    flex-shrink:0;
  }
  .dot.on{ background:var(--moss); }
  .dot.off{ background:var(--clay); }
  h1{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:900;
    font-size:32px;
    margin:2px 0 0;
    color:var(--moss-deep);
    line-height:1.2;
  }
  .gear{
    border:none;background:var(--card);
    width:38px;height:38px;border-radius:12px;
    font-size:17px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    border:1px solid var(--line);
    flex-shrink:0;
  }

  .sync-banner{
    background:var(--clay-soft);
    border-radius:14px;
    padding:12px 14px;
    font-size:12.5px;
    color:#7a4128;
    margin-bottom:16px;
    line-height:1.5;
  }
  .sync-banner b{ display:block; margin-bottom:2px; font-size:13px; }

  .cat-group{ margin-top:16px; }
  .cat-header{
    display:flex;
    align-items:center;
    gap:8px;
    padding:4px 2px;
    cursor:pointer;
    user-select:none;
  }
  .cat-header .chev{
    font-size:11px;
    color:var(--ink-soft);
    transition:transform .15s ease;
  }
  .cat-header.collapsed .chev{ transform:rotate(-90deg); }
  .cat-name{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:14px;
    color:var(--moss-deep);
  }
  .cat-count{
    font-size:12px;
    color:var(--ink-soft);
  }

  .list{
    margin-top:8px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .card{
    background:var(--card);
    border-radius:20px;
    padding:16px 16px 14px;
    border:1px solid var(--line);
    position:relative;
    overflow:hidden;
  }
  .card.due::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:5px;
    background: var(--clay);
  }
  .card.never::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:5px;
    background: #b7bfae;
  }
  .card-top{
    display:flex;
    align-items:flex-start;
    gap:12px;
  }
  .icon{
    font-size:26px;
    width:44px;height:44px;
    display:flex;align-items:center;justify-content:center;
    background:var(--sand);
    border-radius:14px;
    flex-shrink:0;
  }
  .card.due .icon{ background:var(--clay-soft); }
  .meta{ flex:1; min-width:0; }
  .name{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:17px;
    color:var(--moss-deep);
  }
  .lastdate{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .lastdate .by{ color:var(--moss); }
  .del{
    border:none;background:none;color:var(--ink-soft);
    font-size:18px; line-height:1; padding:4px; cursor:pointer;
    opacity:.55;
  }

  .status-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--line);
  }
  .elapsed{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:900;
    font-size:22px;
    color:var(--moss);
  }
  .card.due .elapsed{ color:var(--clay); }
  .card.never .elapsed{ font-size:15px; color:var(--ink-soft); font-weight:700; }
  .elapsed span.unit{
    font-size:13px; font-weight:500; margin-left:2px; color:var(--ink-soft);
  }
  .pace{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .did-btn{
    border:none;
    background: var(--moss);
    color:#fff;
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:13.5px;
    padding:10px 16px;
    border-radius:999px;
    cursor:pointer;
  }
  .card.due .did-btn{ background: var(--clay); }
  .did-btn:active{ transform: scale(0.97); }

  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
    font-size:14px;
  }
  .empty .big{
    font-size:38px; margin-bottom:10px;
  }

  .add-bar{
    margin-top:22px;
  }
  .add-btn{
    width:100%;
    border:1.5px dashed var(--moss);
    background:transparent;
    color:var(--moss-deep);
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:15px;
    padding:15px;
    border-radius:16px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }

  .sheet-backdrop{
    position:fixed; inset:0;
    background:rgba(30,35,25,0.35);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:20;
  }
  .sheet-backdrop.open{ display:flex; }
  .sheet{
    background:var(--sand);
    width:100%;
    max-width:460px;
    max-height:88vh;
    overflow-y:auto;
    border-radius:24px 24px 0 0;
    padding:22px 20px 28px;
  }
  .sheet h2{
    font-family:'Zen Maru Gothic', sans-serif;
    margin:0 0 6px;
    font-size:19px;
    color:var(--moss-deep);
  }
  .sheet .hint{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:16px;
    line-height:1.5;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:6px;
  }
  .field input, .field select{
    width:100%;
    padding:12px 12px;
    border-radius:12px;
    border:1px solid var(--line);
    background:#fff;
    font-size:15px;
    font-family:'M PLUS 2', sans-serif;
    color:var(--ink);
  }
  .icon-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:8px;
  }
  .icon-opt{
    aspect-ratio:1;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:#fff;
    font-size:20px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .icon-opt.selected{
    border-color:var(--moss);
    background: var(--clay-soft);
  }
  .chip-row{
    display:flex; flex-wrap:wrap; gap:8px;
  }
  .chip{
    padding:9px 14px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:#fff;
    font-size:13.5px;
    cursor:pointer;
    color:var(--ink);
  }
  .chip.selected{
    border-color:var(--moss);
    background:var(--moss);
    color:#fff;
  }
  .chip.add-new{
    border-style:dashed;
    color:var(--ink-soft);
  }
  .toggle-row{
    display:flex; gap:8px;
  }
  .toggle-opt{
    flex:1;
    padding:12px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:#fff;
    font-size:13.5px;
    text-align:center;
    cursor:pointer;
    color:var(--ink);
    font-family:'M PLUS 2', sans-serif;
  }
  .toggle-opt.selected{
    border-color:var(--moss);
    background:var(--clay-soft);
    font-weight:700;
  }
  .sheet-actions{
    display:flex; gap:10px; margin-top:18px;
  }
  .sheet-actions button{
    flex:1;
    padding:13px;
    border-radius:14px;
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:14.5px;
    border:none;
    cursor:pointer;
  }
  .cancel-btn{ background:#fff; color:var(--ink-soft); border:1px solid var(--line) !important; }
  .save-btn{ background:var(--moss); color:#fff; }
  .status-line{
    font-size:12px; margin-top:10px; color:var(--ink-soft); text-align:center;
  }
</style>
</head>
<body>
<div class="phone">
  <header>
    <div>
      <div class="eyebrow"><span class="dot off" id="syncDot"></span><span id="syncLabel">未接続</span></div>
      <h1>maekara</h1>
    </div>
    <button class="gear" onclick="openSettings()">⚙️</button>
  </header>

  <div class="sync-banner" id="syncBanner" style="display:none;">
    <b>まだ2人で共有されていません</b>
    ⚙️から共有用のURLを設定すると、お互いの端末で同じ内容が見られます。
  </div>

  <div id="groups"></div>

  <div class="add-bar">
    <button class="add-btn" onclick="openSheet()">＋ 項目を追加</button>
  </div>
</div>

<!-- 項目追加シート -->
<div class="sheet-backdrop" id="backdrop">
  <div class="sheet">
    <h2>新しい項目</h2>
    <div class="field">
      <label>なにを記録する？</label>
      <input type="text" id="inpName" placeholder="例：2階の猫砂掃除">
    </div>
    <div class="field">
      <label>カテゴリ</label>
      <div class="chip-row" id="catChips"></div>
    </div>
    <div class="field">
      <label>アイコン</label>
      <div class="icon-grid" id="iconGrid"></div>
    </div>
    <div class="field">
      <label>登録時の状態</label>
      <div class="toggle-row">
        <div class="toggle-opt selected" id="toggleDone" onclick="setDoneToggle(true)">今日やった</div>
        <div class="toggle-opt" id="toggleNotYet" onclick="setDoneToggle(false)">まだやってない（記録なしで追加）</div>
      </div>
    </div>
    <div class="field" id="dateField">
      <label>最後にやった日</label>
      <input type="date" id="inpDate">
    </div>
    <div class="sheet-actions">
      <button class="cancel-btn" onclick="closeSheet()">キャンセル</button>
      <button class="save-btn" onclick="saveItem()">追加する</button>
    </div>
  </div>
</div>

<!-- 共有設定シート -->
<div class="sheet-backdrop" id="settingsBackdrop">
  <div class="sheet">
    <h2>2人で共有する</h2>
    <div class="hint">
      GASで発行した共有URLを両方の端末で同じものに設定すると、内容が同期されます。
    </div>
    <div class="field">
      <label>あなたの名前（記録に表示されます）</label>
      <input type="text" id="inpMyName" placeholder="例：こうた">
    </div>
    <div class="field">
      <label>共有URL（GASのウェブアプリURL）</label>
      <input type="text" id="inpApiUrl" placeholder="https://script.google.com/macros/s/.../exec">
    </div>
    <div class="sheet-actions">
      <button class="cancel-btn" onclick="closeSettings()">閉じる</button>
      <button class="save-btn" onclick="saveSettings()">保存して同期</button>
    </div>
    <div class="status-line" id="settingsStatus"></div>
  </div>
</div>

<script>
const ICONS = ['🧴','🪥','🛏️','🧹','🧽','🚿','🚽','🪒','🌱','🚗','❄️','🔥','🐾','🧺','🗑️','💊','🔋'];
const DEFAULT_CATEGORIES = ['家事','ペット','からだ','くるま','その他'];

let selectedIcon = ICONS[0];
let selectedCategory = DEFAULT_CATEGORIES[0];
let doneToggle = true; // true: 今日やった / false: まだやってない
let items = [];
let apiUrl = localStorage.getItem('maekara_api_url') || 'https://script.google.com/macros/s/AKfycbxazSqIAdOf78xxg1S6o39p1SCrTj0DlnkwgwkZdbqOgMlsDqRIq70XAy4CXBEzBEgS/exec';
let myName = localStorage.getItem('maekara_my_name') || '';
let collapsed = JSON.parse(localStorage.getItem('maekara_collapsed') || '[]');
let customCategories = JSON.parse(localStorage.getItem('maekara_custom_categories') || '[]');

function iso(d){ return d.toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function loadLocal(){
  try{ return JSON.parse(localStorage.getItem('maekara_items')||'[]'); }
  catch(e){ return []; }
}
function saveLocal(list){ localStorage.setItem('maekara_items', JSON.stringify(list)); }

async function pullFromServer(silent){
  if(!apiUrl) return;
  try{
    const res = await fetch(apiUrl, { method:'GET' });
    const data = await res.json();
    items = data;
    saveLocal(items);
    setSyncState('on');
    render();
  }catch(e){
    setSyncState('off');
    if(!silent) items = loadLocal();
    render();
  }
}

async function pushToServer(){
  saveLocal(items);
  if(!apiUrl) return;
  try{
    await fetch(apiUrl, {
      method:'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(items)
    });
    setSyncState('on');
  }catch(e){
    setSyncState('off');
  }
}

function setSyncState(state){
  const dot = document.getElementById('syncDot');
  const label = document.getElementById('syncLabel');
  const banner = document.getElementById('syncBanner');
  if(!apiUrl){
    dot.className = 'dot off';
    label.textContent = '未接続';
    banner.style.display = 'block';
    return;
  }
  banner.style.display = 'none';
  if(state === 'on'){
    dot.className = 'dot on';
    label.textContent = '共有中';
  }else{
    dot.className = 'dot off';
    label.textContent = '接続できません';
  }
}

function computePace(item){
  const sorted = [...item.dates].sort((a,b)=> a.date.localeCompare(b.date));
  if(sorted.length < 2) return null;
  const intervals = [];
  for(let i=1;i<sorted.length;i++){
    intervals.push(daysBetween(sorted[i-1].date, sorted[i].date));
  }
  return { min: Math.min(...intervals), max: Math.max(...intervals) };
}

function categoryOf(item){ return item.category || 'その他'; }

function allCategoriesInUse(){
  const set = new Set(DEFAULT_CATEGORIES);
  customCategories.forEach(c => set.add(c));
  items.forEach(i => set.add(categoryOf(i)));
  return Array.from(set);
}

function toggleCollapse(cat){
  if(collapsed.includes(cat)){
    collapsed = collapsed.filter(c=>c!==cat);
  }else{
    collapsed.push(cat);
  }
  localStorage.setItem('maekara_collapsed', JSON.stringify(collapsed));
  render();
}

function render(){
  const wrap = document.getElementById('groups');
  if(items.length === 0){
    wrap.innerHTML = '<div class="empty"><div class="big">🌤️</div>忘れっぽいのは、悪いことじゃない。<br>下のボタンから最初の項目を追加しよう。</div>';
    return;
  }
  const today = iso(new Date());
  const cats = allCategoriesInUse().filter(c => items.some(i => categoryOf(i) === c));

  wrap.innerHTML = cats.map(cat => {
    const catItems = items.filter(i => categoryOf(i) === cat);
    const isCollapsed = collapsed.includes(cat);
    const cardsHtml = isCollapsed ? '' : catItems.map(item => renderCard(item, today)).join('');
    return `
      <div class="cat-group">
        <div class="cat-header ${isCollapsed?'collapsed':''}" onclick="toggleCollapse('${escapeHtml(cat)}')">
          <span class="chev">▾</span>
          <span class="cat-name">${escapeHtml(cat)}</span>
          <span class="cat-count">${catItems.length}件</span>
        </div>
        <div class="list">${cardsHtml}</div>
      </div>
    `;
  }).join('');
}

function renderCard(item, today){
  const sorted = [...item.dates].sort((a,b)=> a.date.localeCompare(b.date));
  const hasHistory = sorted.length > 0;
  const pace = hasHistory ? computePace(item) : null;

  let stateClass = '';
  let elapsedHtml = '';
  let paceText = '';
  let lastLabel = 'まだ記録がありません';

  if(hasHistory){
    const last = sorted[sorted.length-1];
    const elapsed = daysBetween(last.date, today);
    lastLabel = formatLastDate(last.date) + (last.by ? ` <span class="by">・${escapeHtml(last.by)}</span>` : '');
    if(pace){
      paceText = `いつも ${pace.min}〜${pace.max}日 ペース`;
      if(elapsed >= pace.min) stateClass = 'due';
    } else {
      paceText = '記録が2回たまるとペースが分かります';
    }
    elapsedHtml = `${elapsed}<span class="unit">日経過</span>`;
  } else {
    stateClass = 'never';
    elapsedHtml = 'まだ未実施';
    paceText = 'やったら「今日やった」を押してね';
  }

  return `
    <div class="card ${stateClass}">
      <div class="card-top">
        <div class="icon">${item.icon}</div>
        <div class="meta">
          <div class="name">${escapeHtml(item.name)}</div>
          <div class="lastdate">${lastLabel}</div>
        </div>
        <button class="del" onclick="confirmRemove(${item.id})">✕</button>
      </div>
      <div class="status-row">
        <div>
          <div class="elapsed">${elapsedHtml}</div>
          <div class="pace">${paceText}</div>
        </div>
        <button class="did-btn" onclick="markDone(${item.id})">今日やった</button>
      </div>
    </div>
  `;
}

function formatLastDate(dateStr){
  const d = new Date(dateStr);
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

function markDone(id){
  const item = items.find(i=>i.id===id);
  if(!item) return;
  const today = iso(new Date());
  item.dates.push({ date: today, by: myName || null });
  pushToServer();
  render();
}

function confirmRemove(id){
  const item = items.find(i=>i.id===id);
  if(!item) return;
  if(confirm(`「${item.name}」を完全に削除しますか？\nこの操作は取り消せません。`)){
    removeItem(id);
  }
}
function removeItem(id){
  items = items.filter(i=>i.id!==id);
  pushToServer();
  render();
}

function openSheet(){
  document.getElementById('inpName').value = '';
  document.getElementById('inpDate').value = iso(new Date());
  selectedIcon = ICONS[0];
  selectedCategory = DEFAULT_CATEGORIES[0];
  doneToggle = true;

  const grid = document.getElementById('iconGrid');
  grid.innerHTML = ICONS.map(ic => `<div class="icon-opt ${ic===selectedIcon?'selected':''}" data-ic="${ic}" onclick="pickIcon('${ic}')">${ic}</div>`).join('');

  renderCatChips();
  setDoneToggle(true);
  document.getElementById('backdrop').classList.add('open');
}
function renderCatChips(){
  const chips = document.getElementById('catChips');
  const cats = allCategoriesInUse();
  chips.innerHTML = cats.map(c => `<div class="chip ${c===selectedCategory?'selected':''}" data-cat="${escapeHtml(c)}" onclick="pickCategory('${escapeHtml(c)}')">${escapeHtml(c)}</div>`).join('')
    + `<div class="chip add-new" onclick="addNewCategory()">＋ 新規</div>`;
}
function pickCategory(c){
  selectedCategory = c;
  document.querySelectorAll('#catChips .chip').forEach(el=>{
    el.classList.toggle('selected', el.dataset.cat === c);
  });
}
function addNewCategory(){
  const name = prompt('新しいカテゴリ名を入力してください');
  if(name && name.trim()){
    const trimmed = name.trim();
    if(!customCategories.includes(trimmed)){
      customCategories.push(trimmed);
      localStorage.setItem('maekara_custom_categories', JSON.stringify(customCategories));
    }
    selectedCategory = trimmed;
    renderCatChips();
  }
}
function pickIcon(ic){
  selectedIcon = ic;
  document.querySelectorAll('.icon-opt').forEach(el=>{
    el.classList.toggle('selected', el.dataset.ic === ic);
  });
}
function setDoneToggle(val){
  doneToggle = val;
  document.getElementById('toggleDone').classList.toggle('selected', val);
  document.getElementById('toggleNotYet').classList.toggle('selected', !val);
  document.getElementById('dateField').style.display = val ? 'block' : 'none';
}
function closeSheet(){
  document.getElementById('backdrop').classList.remove('open');
}
function saveItem(){
  const name = document.getElementById('inpName').value.trim();
  if(!name){ alert('項目名を入力してください'); return; }

  let dates = [];
  if(doneToggle){
    const date = document.getElementById('inpDate').value;
    if(!date){ alert('日付を入力してください'); return; }
    dates = [{ date, by: myName || null }];
  }

  items.push({ id: Date.now(), name, icon: selectedIcon, category: selectedCategory, dates });
  pushToServer();
  closeSheet();
  render();
}

function openSettings(){
  document.getElementById('inpMyName').value = myName;
  document.getElementById('inpApiUrl').value = apiUrl;
  document.getElementById('settingsStatus').textContent = '';
  document.getElementById('settingsBackdrop').classList.add('open');
}
function closeSettings(){
  document.getElementById('settingsBackdrop').classList.remove('open');
}
async function saveSettings(){
  myName = document.getElementById('inpMyName').value.trim();
  apiUrl = document.getElementById('inpApiUrl').value.trim();
  localStorage.setItem('maekara_my_name', myName);
  localStorage.setItem('maekara_api_url', apiUrl);
  const statusEl = document.getElementById('settingsStatus');
  statusEl.textContent = '接続を確認中...';
  await pullFromServer(true);
  statusEl.textContent = apiUrl ? '保存しました' : 'ローカル保存モードにしました';
  setTimeout(closeSettings, 700);
}

// 初期化
items = loadLocal();
render();
setSyncState(apiUrl ? 'checking' : 'off');
pullFromServer(true);
// ゆるく自動同期（相手の更新を拾う）
setInterval(()=>{ if(apiUrl) pullFromServer(true); }, 20000);
</script>
